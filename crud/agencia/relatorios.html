<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f5f5f5; }

        .abas { display: flex; gap: 4px; margin-bottom: -1px; }
        .abas a { padding: 10px 22px; text-decoration: none; color: #444; background: #e0e0e0; border-radius: 8px 8px 0 0; font-size: 15px; }
        .abas a:hover { background: #d0d0d0; }
        .abas a.ativa { background: #fff; color: #000; font-weight: bold; }

        .container { background: #fff; padding: 25px; border-radius: 0 8px 8px 8px; }
        h1 { margin-top: 0; }
        h2 { margin-top: 35px; }
        .filtro { margin-bottom: 10px; }
        .filtro input { padding: 6px; font-size: 15px; width: 90px; }
        .filtro button { padding: 7px 14px; font-size: 14px; cursor: pointer; margin-left: 10px; }
        .grafico { position: relative; height: 300px; margin-bottom: 20px; }
        .total { font-weight: bold; margin: 8px 0; }

        /* Ao imprimir, esconde as abas e os botoes. */
        @media print {
            .abas, .filtro, .dt-buttons { display: none; }
            body { margin: 0; background: #fff; }
        }
    </style>
</head>
<body>
    <nav class="abas">
        <a href="dashboard.html">Dashboard</a>
        <a href="index.html">Viagens</a>
        <a href="cadastro.html">Cadastro</a>
        <a href="relatorios.html" class="ativa">Relatórios</a>
    </nav>

    <div class="container">
        <h1>Relatórios</h1>

        <div class="filtro">
            <label for="ano">Ano:</label>
            <input type="number" id="ano" min="2000" max="2100">
            <button type="button" onclick="window.print()">Imprimir / salvar página em PDF</button>
        </div>

        <h2>Faturamento por mês</h2>
        <div class="grafico"><canvas id="g-mensal"></canvas></div>
        <p class="total" id="total-ano"></p>
        <table id="t-mensal" class="display" style="width:100%">
            <thead><tr><th>Mês</th><th>Viagens</th><th>Faturamento</th></tr></thead>
        </table>

        <h2>Destinos mais vendidos</h2>
        <div class="grafico"><canvas id="g-destinos"></canvas></div>
        <table id="t-destinos" class="display" style="width:100%">
            <thead><tr><th>Destino</th><th>Viagens</th><th>Faturamento</th></tr></thead>
        </table>

        <h2>Melhores clientes</h2>
        <div class="grafico"><canvas id="g-clientes"></canvas></div>
        <table id="t-clientes" class="display" style="width:100%">
            <thead><tr><th>Cliente</th><th>Telefone</th><th>Viagens</th><th>Total gasto</th></tr></thead>
        </table>
    </div>

    <!-- Ordem importa: jQuery, DataTables, botoes de exportacao, Chart.js e depois o seu codigo. -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="../js/comum.js"></script>
    <script src="../js/relatorios.js"></script>
</body>
</html>
