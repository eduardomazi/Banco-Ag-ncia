<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Usuarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.css" rel="stylesheet">
</head>
<body>
    <main class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-4">Listagem de Usuarios</h1>

                <div class="table-responsive">
                    <table id="tabela-usuarios" class="table table-striped table-bordered align-middle w-100">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Email</th>
                                <th>Telefone</th>
                                <th>CPF</th>
                                <th>Nascimento</th>
                                <th>Login</th>
                                <th>Tipo</th>
                                <th>Cadastro</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Importa o jQuery, biblioteca necessaria para o DataTables funcionar. -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Importa o JavaScript do Bootstrap, usado para os componentes visuais do framework. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Importa o JavaScript principal do DataTables, usado para criar tabelas com busca, paginacao e ordenacao. -->
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.js"></script>

    <!-- Importa a integracao do DataTables com Bootstrap 5, deixando a tabela com o visual do Bootstrap. -->
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.js"></script>

    <!-- Importa o arquivo JavaScript do projeto, responsavel por buscar e exibir os usuarios. -->
    <script src="../js/usuario.js"></script>
</body>
</html>
